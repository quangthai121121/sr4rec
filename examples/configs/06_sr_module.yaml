# Example 06: your own SR model as a Python class (method 2).
# Run from the repository root:
#   sr4rec run examples/configs/06_sr_module.yaml
# Expected time: about 5 minutes on a laptop CPU.
# The model code is examples/sr_models/tiny_espcn.py; its weights come from train_tiny_espcn.py.
# Before the first run (once):
#   python scripts/make_examples.py --pets <path_to_oxford_iiit_pet>   # builds examples/data/pets_mini
#   python examples/sr_models/train_tiny_espcn.py                      # trains the example SR weights
dataset: ../data/pets_mini
mode: synthetic
scale: 4
sr:
  - name: tiny_espcn
    module: ../sr_models/tiny_espcn.py:TinyESPCN
    weights: ../sr_models/tiny_espcn_x4_pets.pth
recognizer:
  backbones: [resnet18]
  input_size: 128
  seeds: [0]
training:
  epochs: 3
  batch_size: 32
  num_workers: 0
latency:
  lr_size: 64
  threads: 2
comparisons:
  count: 6
runtime:
  output_dir: ../../runs
