# Example 05: let SR4Rec create the split from your own ratios (the split column is ignored).
# Run from the repository root:
#   sr4rec run examples/configs/05_split_ratios.yaml
# Expected time: about 5 minutes on a laptop CPU.
# Before the first run (once):
#   python scripts/make_examples.py --pets <path_to_oxford_iiit_pet>   # builds examples/data/pets_mini
dataset: ../data/pets_mini
mode: synthetic
scale: 4
protocol: matched
split:
  source: ratios
  ratios: {train: 0.8, val: 0.1, test: 0.1}
  seed: 0
# No SR model is listed: the example SR weights were trained on the official train images of
# pets_mini, and a new split would put some of them in test. Add your own SR models here.
sr: []
recognizer:
  backbones: [resnet18]
  input_size: 128
  seeds: [0]
training:
  epochs: 3
  batch_size: 32
  num_workers: 0
latency:
  lr_size: 64
  threads: 2
comparisons:
  count: 6
runtime:
  output_dir: ../../runs
