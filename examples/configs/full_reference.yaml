# =============================================================================
# SR4Rec configuration file (SR4Rec v0.1.0)
#
# Generated by `sr4rec init`. Lines marked [CHECK] were inferred by SR4Rec:
# confirm or edit the value, then delete the "[CHECK]" marker.
# `sr4rec run` refuses to start while any [CHECK] marker remains.
#
# Each key is documented with:
#   type     : value type
#   required : yes | no | conditional
#   default  : value used when the key is omitted
#   allowed  : the complete list of accepted values, or the valid range
#
# Unknown keys are rejected, so typos never pass silently.
# Full reference: docs/config_reference.md
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Dataset and protocol
# -----------------------------------------------------------------------------
# Dataset folder. It must contain `images/` and `labels.csv` (see
# docs/preparing_dataset.md). A relative path is resolved from the folder that contains
# this file. Recommended location: data/<dataset_name>.
#   type: path | required: yes | default: none
#   allowed: an existing folder
dataset: ../data/pets_mini

# Resolution of the images in `images/`.
#   type: enum | required: yes | default: none
#   allowed:
#     synthetic : images are high resolution (HR). SR4Rec downsamples them by `scale`;
#                 PSNR/SSIM and an HR upper bound are reported.
#     native-lr : images are already low resolution. No downsampling; PSNR/SSIM are not
#                 available (there is no HR reference).
mode: synthetic

# Upscaling factor. In `synthetic` mode it is also the downsampling factor. Every SR
# model below must have exactly this scale, otherwise the run stops.
#   type: integer (enum) | required: no | default: 4
#   allowed: 2 | 3 | 4
scale: 4

# How the recognizer is trained with respect to SR.
#   type: enum | required: no | default: matched
#   allowed:
#     matched          : for every SR model (and bicubic), the train, val and test
#                        images all pass through that SR model; one recognizer is
#                        trained per SR model, backbone and seed. Answers: "does a
#                        system built with this SR model recognize better?"
#     fixed_recognizer : one recognizer per backbone and seed, trained on HR images
#                        (synthetic) or bicubic-upscaled images (native-lr); only the
#                        test images pass through SR. Answers: "does adding SR in front
#                        of an existing recognizer help?" Fewer recognizer trainings.
protocol: matched


# -----------------------------------------------------------------------------
# 2. Train / val / test split
# -----------------------------------------------------------------------------
split:
  # Where the train/val/test assignment comes from.
  #   type: enum | required: no | default: auto
  #   allowed:
  #     auto   : use the `split` column of labels.csv if it exists, otherwise split by
  #              `ratios`
  #     column : use the `split` column; stop with an error if it is missing
  #     ratios : ignore any `split` column and split by `ratios`
  source: auto

  # Fractions of images for each split, used when SR4Rec creates the split. Applied
  # inside every class (each class keeps at least one image in train, val and test). The
  # report prints the actual counts.
  #   type: mapping with keys train, val, test | required: no | default: {train: 0.7, val: 0.1, test: 0.2}
  #   allowed: each value greater than 0 and less than 1; the three values must sum to 1.0
  ratios:
    # Fraction of images in the train split.
    #   type: float | required: no | default: 0.7
    #   allowed: greater than 0 and less than 1
    train: 0.7

    # Fraction of images in the val split.
    #   type: float | required: no | default: 0.1
    #   allowed: greater than 0 and less than 1
    val: 0.1

    # Fraction of images in the test split.
    #   type: float | required: no | default: 0.2
    #   allowed: greater than 0 and less than 1
    test: 0.2

  # Fraction of the train images moved to val when the `split` column has train and test
  # rows but no val rows.
  #   type: float | required: no | default: 0.1
  #   allowed: greater than 0, at most 0.5
  val_from_train: 0.1

  # Seed used to create the split. It is independent of the recognizer seeds, so all
  # recognizer seeds share the same split.
  #   type: integer | required: no | default: 0
  #   allowed: 0 to 2147483647
  seed: 0


# -----------------------------------------------------------------------------
# 3. SR models
# -----------------------------------------------------------------------------
# The bicubic baseline is always added automatically; do not list it.
# Each entry needs `name` and ONE source (step-by-step guide: docs/adding_sr_models.md;
# runnable examples: examples/configs/02, 05, 06):
#   method 1 (weights) : `weights` only           -> loaded with spandrel
#   method 2 (module)  : `module` (+ `weights`)   -> your own PyTorch class
#   method 3 (images)  : `images` only            -> pre-computed SR images
# Check every entry with `sr4rec run <config> --dry-run` before a real run.
#
#   name:
#       Name used in reports.
#       type: string | required: yes | default: none
#       allowed: letters, digits, "_" and "-"; must be unique; "bicubic" and "hr" are reserved
#   weights:
#       Method 1: a .pth or .safetensors file whose architecture spandrel can detect
#       (its scale must equal `scale`). Method 2: optional file passed to the class as
#       __init__(weights=<path>). Recommended location: weights/.
#       type: path | required: conditional (method 1; optional in method 2) | default: null
#       allowed: any existing file
#   module:
#       Method 2: a Python file and a torch.nn.Module class with an integer attribute
#       `scale` equal to `scale` and forward(x) mapping (N, 3, H, W) in [0, 1] to (N, 3,
#       H*scale, W*scale). Recommended location: sr_models/.
#       type: string "<file.py>:<ClassName>" | required: conditional (method 2) | default: null
#       allowed: an existing Python file and a class defined in it
#   images:
#       Method 3: a folder of PNG images with the same relative paths as the dataset
#       images (train, val and test images for protocol `matched`; test images only for
#       `fixed_recognizer`). Recommended location: sr_images/<name>/. CPU latency is not
#       measured for this source.
#       type: path | required: conditional (method 3; no other source key) | default: null
#       allowed: an existing folder
#   tile:
#       LR tile size in pixels for tiled inference (tiles overlap by 16 px). Use it only
#       if the GPU runs out of memory. Valid for methods 1 and 2 only.
#       type: integer or null | required: no | default: null
#       allowed: null (process the whole image) | 64 to 1024
# -----------------------------------------------------------------------------
sr: []
  # - name: realesrgan                              # method 1: weights file
  #   weights: weights/RealESRGAN_x4plus.pth
  # - name: my_sr                                   # method 2: your PyTorch class
  #   module: sr_models/tiny_espcn.py:TinyESPCN
  #   weights: weights/tiny_espcn_x4.pth
  # - name: my_method                               # method 3: pre-computed images
  #   images: sr_images/my_method/


# -----------------------------------------------------------------------------
# 4. Recognizer
# -----------------------------------------------------------------------------
recognizer:
  # Recognition backbones (timm model names, fine-tuned for the dataset classes).
  #   type: list of strings | required: no | default: [resnet18, mobilenetv3_small_100, convnext_tiny]
  #   allowed:
  #     validated by SR4Rec: resnet18 | mobilenetv3_small_100 | convnext_tiny
  #     any other timm model name runs with an "experimental" warning
  backbones: [resnet18, mobilenetv3_small_100, convnext_tiny]

  # Start from ImageNet-pretrained weights downloaded by timm (needs internet access or
  # a filled HF_HOME cache).
  #   type: boolean | required: no | default: true
  #   allowed: true | false
  pretrained: true

  # Side length of the square recognizer input. Every image is letterboxed (longer side
  # resized to this value, aspect ratio kept, ImageNet-mean padding; never stretched)
  # and ImageNet-normalized.
  #   type: integer | required: no | default: 224
  #   allowed: 64 to 512, multiple of 32
  input_size: 224

  # Random seeds. One recognizer is trained per image pipeline, backbone and seed.
  #   type: list of integers | required: no | default: [0, 1, 2]
  #   allowed: 1 to 10 distinct integers from 0 to 2147483647 (3 or more recommended)
  seeds: [0, 1, 2]


# -----------------------------------------------------------------------------
# 5. Training (recognizer only; SR models are never trained)
# -----------------------------------------------------------------------------
training:
  # Number of training epochs. The checkpoint with the best val Rank-1 accuracy is kept.
  #   type: integer | required: no | default: 30
  #   allowed: 1 to 500
  epochs: 30

  # Mini-batch size.
  #   type: integer | required: no | default: 64
  #   allowed: 1 to 1024
  batch_size: 64

  # AdamW learning rate (cosine schedule, 1 warm-up epoch).
  #   type: float | required: no | default: 0.0003
  #   allowed: greater than 0, at most 1.0
  learning_rate: 0.0003

  # AdamW weight decay.
  #   type: float | required: no | default: 0.05
  #   allowed: 0.0 to 1.0
  weight_decay: 0.05

  # Random horizontal flip during training. Off by default because flipping can remove
  # identity cues (e.g. left vs right ear).
  #   type: boolean | required: no | default: false
  #   allowed: true | false
  horizontal_flip: false

  # Data-loading worker processes.
  #   type: integer | required: no | default: 4
  #   allowed: 0 to 64
  num_workers: 4


# -----------------------------------------------------------------------------
# 6. CPU latency benchmark
# -----------------------------------------------------------------------------
latency:
  # Measure CPU latency of each SR model, each backbone and the full pipeline.
  #   type: boolean | required: no | default: true
  #   allowed: true | false
  enabled: true

  # Side length of the square LR input used for timing.
  #   type: integer | required: no | default: 64
  #   allowed: 16 to 512
  lr_size: 64

  # Number of CPU threads used for timing.
  #   type: integer | required: no | default: 4
  #   allowed: 1 to 64
  threads: 4


# -----------------------------------------------------------------------------
# 7. Visual comparisons (before SR / after SR)
# -----------------------------------------------------------------------------
comparisons:
  # Export one PNG per selected test image that combines the LR input, bicubic, every SR
  # model and (synthetic mode) the HR image, each with an English caption: method name,
  # predicted label with a correct/wrong mark, and PSNR/SSIM (synthetic mode only).
  #   type: boolean | required: no | default: true
  #   allowed: true | false
  enabled: true

  # Number of test images to export.
  #   type: integer | required: no | default: 24
  #   allowed: 1 to 1000
  count: 24

  # How the test images are chosen.
  #   type: enum | required: no | default: mixed
  #   allowed:
  #     mixed  : one third corrected by at least one SR model (bicubic wrong, SR
  #              right), one third degraded by at least one SR model (bicubic right, SR
  #              wrong), one third random; fixed selection seed 0
  #     random : uniformly at random from the test set; fixed selection seed 0
  #     all    : every test image (ignores `count`; can produce many files)
  selection: mixed

  # Backbone whose predictions (first seed) are written in the captions.
  #   type: string or null | required: no | default: null
  #   allowed: null (first backbone in `recognizer.backbones`) | any name listed in `recognizer.backbones`
  backbone: null


# -----------------------------------------------------------------------------
# 8. Runtime
# -----------------------------------------------------------------------------
runtime:
  # Device for SR inference and recognizer training. If the GPU runs out of memory, the
  # run never stops: SR switches to smaller tiles, training to gradient accumulation
  # (same effective batch size) and evaluation to smaller batches, and as a last resort
  # the step continues on the CPU; the report lists every such fallback.
  #   type: enum | required: no | default: auto
  #   allowed:
  #     auto : CUDA GPU if available, otherwise Apple GPU (MPS), otherwise the CPU
  #     cuda : CUDA GPU; if none is found, fall back to MPS, then the CPU, with a
  #            warning
  #     mps  : Apple GPU (Apple silicon); if unavailable, fall back to the CPU with a
  #            warning
  #     cpu  : always the CPU (slow; intended for small datasets and tests)
  device: auto

  # Parent folder for all runs.
  #   type: path | required: no | default: runs
  #   allowed: any folder path
  output_dir: runs

  # Folder for cached LR/SR images and trained recognizer checkpoints, shared by all
  # runs so that repeated runs are fast. Deleting it is always safe.
  #   type: path or null | required: no | default: null
  #   allowed: null (use <output_dir>/.cache) | any folder path
  cache_dir: null

  # Name of this run's folder inside `output_dir`.
  #   type: string or null | required: no | default: null
  #   allowed: null (automatic: <dataset>_<YYYY-MM-DD>_<HHMM>) | letters, digits, "_" and "-"
  run_name: null
