# SR4Rec demo definition: quickstart
demo: quickstart
description: pets_mini, synthetic x4, tiny_espcn (method 2), ResNet-18, 1 seed, CPU (about 5 min)
defaults:
  data_root: examples/data
  weights_root: examples/sr_models
notes: 'Build pets_mini first: python scripts/make_examples.py --pets <path_to_oxford_iiit_pet>; then train the
  example SR weights: python examples/sr_models/train_tiny_espcn.py'
config:
  dataset: '{data_root}/pets_mini'
  mode: synthetic
  scale: 4
  protocol: matched
  sr:
  - name: tiny_espcn
    module: '{weights_root}/tiny_espcn.py:TinyESPCN'
    weights: '{weights_root}/tiny_espcn_x4_pets.pth'
  recognizer:
    backbones:
    - resnet18
    input_size: 128
    seeds:
    - 0
  training:
    epochs: 3
    batch_size: 32
    num_workers: 0
  latency:
    enabled: true
    lr_size: 64
    threads: 2
  comparisons:
    count: 6
